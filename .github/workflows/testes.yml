# Roda os testes a cada envio ao GitHub. Se algo quebrar, o envio aparece com um X vermelho.
name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
